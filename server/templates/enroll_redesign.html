<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>事件驱动边缘视觉识别系统 - 人脸录入</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-primary: #0a0e14;
            --bg-secondary: #0f1419;
            --bg-card: #141921;
            --bg-card-hover: #1a2029;
            --border-primary: #1e2733;
            --border-accent: #00d4ff;
            --text-primary: #e8edf3;
            --text-secondary: #7a8ba3;
            --text-muted: #4a5568;
            --accent-cyan: #00d4ff;
            --accent-cyan-dim: rgba(0, 212, 255, 0.15);
            --accent-green: #00ff88;
            --accent-green-dim: rgba(0, 255, 136, 0.12);
            --accent-amber: #ffb800;
            --accent-amber-dim: rgba(255, 184, 0, 0.12);
            --accent-red: #ff3366;
            --accent-red-dim: rgba(255, 51, 102, 0.12);
            --glow-cyan: 0 0 20px rgba(0, 212, 255, 0.3);
            --glow-green: 0 0 15px rgba(0, 255, 136, 0.25);
            --font-mono: 'JetBrains Mono', monospace;
            --font-sans: 'Inter', -apple-system, sans-serif;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-sans);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* 背景网格效果 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background:
                linear-gradient(90deg, transparent 49.5%, rgba(0, 212, 255, 0.03) 49.5%, rgba(0, 212, 255, 0.03) 50.5%, transparent 50.5%),
                linear-gradient(0deg, transparent 49.5%, rgba(0, 212, 255, 0.03) 49.5%, rgba(0, 212, 255, 0.03) 50.5%, transparent 50.5%);
            background-size: 60px 60px;
            pointer-events: none;
            z-index: 0;
        }

        /* 顶部导航 */
        .header {
            position: relative;
            z-index: 10;
            background: linear-gradient(180deg, rgba(15, 20, 25, 0.98) 0%, rgba(15, 20, 25, 0.95) 100%);
            border-bottom: 1px solid var(--border-primary);
            padding: 0 32px;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            backdrop-filter: blur(20px);
        }

        .header::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            right: 0;
            height: 1px;
            background: linear-gradient(90deg, transparent, var(--accent-cyan), transparent);
            opacity: 0.5;
        }

        .header-left {
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            background: linear-gradient(135deg, var(--accent-cyan), var(--accent-green));
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            box-shadow: var(--glow-cyan);
        }

        .header h1 {
            font-family: var(--font-mono);
            font-size: 1rem;
            font-weight: 600;
            color: var(--text-primary);
            letter-spacing: 1px;
        }

        .header-subtitle {
            font-size: 0.7rem;
            color: var(--text-muted);
            font-family: var(--font-mono);
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 24px;
        }

        .nav-links {
            display: flex;
            gap: 8px;
        }

        .nav-links a {
            color: var(--text-secondary);
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 500;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.2s ease;
            position: relative;
        }

        .nav-links a:hover {
            color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
        }

        .nav-links a.active {
            color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
        }

        .status-group {
            display: flex;
            align-items: center;
            gap: 16px;
            padding-left: 24px;
            border-left: 1px solid var(--border-primary);
        }

        .status-indicator {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 0.75rem;
            font-family: var(--font-mono);
            color: var(--text-secondary);
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            position: relative;
        }

        .status-dot.online {
            background: var(--accent-green);
            box-shadow: 0 0 8px var(--accent-green);
        }

        .status-dot.online::after {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            right: -3px;
            bottom: -3px;
            border-radius: 50%;
            border: 1px solid var(--accent-green);
            animation: pulse-ring 2s ease-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(1); opacity: 1; }
            100% { transform: scale(1.5); opacity: 0; }
        }

        /* 主容器 */
        .container {
            position: relative;
            z-index: 1;
            max-width: 900px;
            margin: 0 auto;
            padding: 32px;
        }

        /* 卡片样式 */
        .card {
            background: var(--bg-card);
            border: 1px solid var(--border-primary);
            border-radius: 12px;
            overflow: hidden;
            margin-bottom: 24px;
            animation: fadeIn 0.5s ease forwards;
        }

        .card:nth-child(1) { animation-delay: 0.1s; }
        .card:nth-child(2) { animation-delay: 0.2s; }

        .card-header {
            padding: 20px 24px;
            border-bottom: 1px solid var(--border-primary);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .card-title {
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .card-title .icon {
            width: 32px;
            height: 32px;
            background: var(--accent-cyan-dim);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 8px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
        }

        .card-badge {
            font-size: 0.65rem;
            font-family: var(--font-mono);
            color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
            padding: 4px 10px;
            border-radius: 4px;
            border: 1px solid rgba(0, 212, 255, 0.2);
        }

        .card-body {
            padding: 24px;
        }

        /* 表单样式 */
        .form-group {
            margin-bottom: 24px;
        }

        .form-label {
            display: block;
            font-family: var(--font-mono);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--text-muted);
            text-transform: uppercase;
            letter-spacing: 1.5px;
            margin-bottom: 10px;
        }

        .form-input {
            width: 100%;
            padding: 14px 18px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 8px;
            color: var(--text-primary);
            font-family: var(--font-sans);
            font-size: 0.95rem;
            transition: all 0.2s ease;
            outline: none;
        }

        .form-input:focus {
            border-color: var(--accent-cyan);
            box-shadow: 0 0 0 3px var(--accent-cyan-dim);
        }

        .form-input::placeholder {
            color: var(--text-muted);
        }

        /* 上传区域 */
        .upload-zone {
            border: 2px dashed var(--border-primary);
            border-radius: 12px;
            padding: 48px 24px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: var(--bg-secondary);
            position: relative;
            overflow: hidden;
        }

        .upload-zone:hover {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.03);
        }

        .upload-zone.dragover {
            border-color: var(--accent-cyan);
            background: rgba(0, 212, 255, 0.08);
            transform: scale(1.01);
        }

        .upload-icon {
            width: 64px;
            height: 64px;
            margin: 0 auto 20px;
            background: var(--accent-cyan-dim);
            border: 1px solid rgba(0, 212, 255, 0.2);
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 28px;
            transition: all 0.3s ease;
        }

        .upload-zone:hover .upload-icon {
            transform: translateY(-4px);
            box-shadow: var(--glow-cyan);
        }

        .upload-title {
            font-family: var(--font-mono);
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }

        .upload-hint {
            font-size: 0.8rem;
            color: var(--text-muted);
        }

        .file-input {
            display: none;
        }

        /* 预览网格 */
        .preview-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
            gap: 12px;
            margin-top: 20px;
        }

        .preview-item {
            position: relative;
            aspect-ratio: 1;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid var(--border-primary);
            transition: all 0.2s ease;
        }

        .preview-item:hover {
            border-color: var(--accent-cyan);
            transform: scale(1.05);
        }

        .preview-item img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .preview-remove {
            position: absolute;
            top: 6px;
            right: 6px;
            background: rgba(255, 51, 102, 0.9);
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .preview-item:hover .preview-remove {
            opacity: 1;
        }

        /* 提交按钮 */
        .btn {
            padding: 14px 28px;
            border: none;
            border-radius: 8px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 1px;
            display: inline-flex;
            align-items: center;
            gap: 10px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--accent-cyan), #0099cc);
            color: white;
            box-shadow: 0 4px 16px rgba(0, 212, 255, 0.3);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 24px rgba(0, 212, 255, 0.4);
        }

        .btn-primary:disabled {
            background: var(--bg-card-hover);
            color: var(--text-muted);
            box-shadow: none;
            cursor: not-allowed;
            transform: none;
        }

        /* 消息提示 */
        .message {
            padding: 16px 20px;
            border-radius: 8px;
            margin-top: 20px;
            font-family: var(--font-mono);
            font-size: 0.85rem;
            display: none;
            animation: fadeIn 0.3s ease;
        }

        .message.success {
            background: var(--accent-green-dim);
            border: 1px solid rgba(0, 255, 136, 0.3);
            color: var(--accent-green);
            display: block;
        }

        .message.error {
            background: var(--accent-red-dim);
            border: 1px solid rgba(255, 51, 102, 0.3);
            color: var(--accent-red);
            display: block;
        }

        /* 已录入人脸 */
        .face-tags {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-top: 8px;
        }

        .face-tag {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-primary);
            border-radius: 20px;
            padding: 8px 16px;
            font-family: var(--font-mono);
            font-size: 0.8rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
        }

        .face-tag:hover {
            border-color: var(--accent-cyan);
            background: var(--accent-cyan-dim);
        }

        .face-tag .tag-icon {
            width: 20px;
            height: 20px;
            background: var(--accent-cyan-dim);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 10px;
        }

        .empty-state {
            text-align: center;
            padding: 32px;
            color: var(--text-muted);
            font-family: var(--font-mono);
            font-size: 0.85rem;
        }

        /* 扫描线效果 */
        .scanline {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: repeating-linear-gradient(
                0deg,
                transparent,
                transparent 2px,
                rgba(0, 212, 255, 0.01) 2px,
                rgba(0, 212, 255, 0.01) 4px
            );
            pointer-events: none;
            z-index: 999;
            opacity: 0.3;
        }

        /* 动画 */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- 扫描线效果 -->
    <div class="scanline"></div>

    <!-- 顶部导航 -->
    <div class="header">
        <div class="header-left">
            <div class="logo-icon">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5">
                    <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                    <circle cx="12" cy="12" r="3"></circle>
                </svg>
            </div>
            <div>
                <h1>事件驱动边缘视觉识别系统</h1>
                <div class="header-subtitle">Event-Driven Edge Vision Recognition</div>
            </div>
        </div>
        <div class="header-right">
            <nav class="nav-links">
                <a href="/camera">识别看板</a>
                <a href="/enroll" class="active">人脸录入</a>
            </nav>
            <div class="status-group">
                <div class="status-indicator">
                    <span class="status-dot online"></span>
                    <span>ESP32-CAM</span>
                </div>
                <div class="status-indicator">
                    <span class="status-dot online"></span>
                    <span>Server</span>
                </div>
            </div>
        </div>
    </div>

    <!-- 主容器 -->
    <div class="container">
        <!-- 录入卡片 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">
                    <span class="icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                            <circle cx="12" cy="7" r="4"></circle>
                        </svg>
                    </span>
                    录入新人脸
                </span>
                <span class="card-badge">NEW FACE</span>
            </div>
            <div class="card-body">
                <form id="enroll-form">
                    <div class="form-group">
                        <label class="form-label" for="name">人员姓名</label>
                        <input type="text" id="name" class="form-input" placeholder="请输入姓名，例如：张三" required>
                    </div>
                    <div class="form-group">
                        <label class="form-label">上传照片</label>
                        <div class="upload-zone" id="upload-zone">
                            <div class="upload-icon">
                                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="17 8 12 3 7 8"></polyline>
                                    <line x1="12" y1="3" x2="12" y2="15"></line>
                                </svg>
                            </div>
                            <div class="upload-title">点击或拖拽上传照片</div>
                            <div class="upload-hint">支持 JPG、PNG 格式，建议 3-5 张不同角度的照片</div>
                            <input type="file" id="file-input" class="file-input" multiple accept="image/*">
                        </div>
                        <div class="preview-grid" id="preview-grid"></div>
                    </div>
                    <button type="submit" class="btn btn-primary" id="submit-btn" disabled>
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M12 5v14M5 12h14"></path>
                        </svg>
                        开始录入
                    </button>
                </form>
                <div class="message" id="message"></div>
            </div>
        </div>

        <!-- 已录入人脸 -->
        <div class="card">
            <div class="card-header">
                <span class="card-title">
                    <span class="icon">
                        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                            <circle cx="9" cy="7" r="4"></circle>
                            <path d="M23 21v-2a4 4 0 0 0-3-3.87"></path>
                            <path d="M16 3.13a4 4 0 0 1 0 7.75"></path>
                        </svg>
                    </span>
                    已录入的人脸
                </span>
                <span class="card-badge">DATABASE</span>
            </div>
            <div class="card-body">
                <div class="face-tags" id="face-tags">
                    <span style="color: var(--text-muted);">加载中...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const form = document.getElementById('enroll-form');
        const nameInput = document.getElementById('name');
        const uploadZone = document.getElementById('upload-zone');
        const fileInput = document.getElementById('file-input');
        const previewGrid = document.getElementById('preview-grid');
        const submitBtn = document.getElementById('submit-btn');
        const message = document.getElementById('message');
        const faceTags = document.getElementById('face-tags');

        let selectedFiles = [];

        // 点击上传区域
        uploadZone.addEventListener('click', () => {
            fileInput.click();
        });

        // 拖拽上传
        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        // 文件选择
        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        function handleFiles(files) {
            for (const file of files) {
                if (file.type.startsWith('image/')) {
                    selectedFiles.push(file);
                }
            }
            updatePreview();
            updateSubmitBtn();
        }

        function updatePreview() {
            previewGrid.innerHTML = '';
            selectedFiles.forEach((file, index) => {
                const reader = new FileReader();
                reader.onload = (e) => {
                    const div = document.createElement('div');
                    div.className = 'preview-item';
                    div.innerHTML = `
                        <img src="${e.target.result}" alt="预览">
                        <button class="preview-remove" onclick="removeFile(${index})">×</button>
                    `;
                    previewGrid.appendChild(div);
                };
                reader.readAsDataURL(file);
            });
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updatePreview();
            updateSubmitBtn();
        }

        function updateSubmitBtn() {
            submitBtn.disabled = !nameInput.value.trim() || selectedFiles.length === 0;
        }

        nameInput.addEventListener('input', updateSubmitBtn);

        // 提交表单
        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            const name = nameInput.value.trim();
            if (!name || selectedFiles.length === 0) {
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="animation: spin 1s linear infinite;">
                    <path d="M21 12a9 9 0 1 1-6.219-8.56"></path>
                </svg>
                录入中...
            `;

            const formData = new FormData();
            formData.append('name', name);
            selectedFiles.forEach(file => {
                formData.append('images', file);
            });

            try {
                const res = await fetch('/api/enroll', {
                    method: 'POST',
                    body: formData,
                });
                const data = await res.json();

                if (data.status === 'ok') {
                    message.className = 'message success';
                    message.textContent = data.message;
                    nameInput.value = '';
                    selectedFiles = [];
                    updatePreview();
                    loadExistingFaces();
                } else {
                    message.className = 'message error';
                    message.textContent = data.message;
                }
            } catch (err) {
                message.className = 'message error';
                message.textContent = '上传失败: ' + err.message;
            }

            submitBtn.disabled = false;
            submitBtn.innerHTML = `
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M12 5v14M5 12h14"></path>
                </svg>
                开始录入
            `;
            updateSubmitBtn();
        });

        // 加载已录入的人脸
        async function loadExistingFaces() {
            try {
                const res = await fetch('/api/faces');
                const data = await res.json();
                if (data.faces && data.faces.length > 0) {
                    faceTags.innerHTML = data.faces.map(name =>
                        `<span class="face-tag">
                            <span class="tag-icon">
                                <svg width="10" height="10" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                                    <circle cx="12" cy="7" r="4"></circle>
                                </svg>
                            </span>
                            ${name}
                        </span>`
                    ).join('');
                } else {
                    faceTags.innerHTML = '<span style="color: var(--text-muted); font-family: var(--font-mono); font-size: 0.85rem;">暂无人脸数据</span>';
                }
            } catch (err) {
                faceTags.innerHTML = '<span style="color: var(--accent-red); font-family: var(--font-mono); font-size: 0.85rem;">加载失败</span>';
            }
        }

        loadExistingFaces();

        // 添加旋转动画样式
        const style = document.createElement('style');
        style.textContent = `
            @keyframes spin {
                to { transform: rotate(360deg); }
            }
        `;
        document.head.appendChild(style);
    </script>
</body>
</html>
